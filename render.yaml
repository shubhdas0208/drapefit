# Render Blueprint (free tier). Secrets are entered in the Render dashboard (sync: false),
# never committed. See docs/deploy.md.
services:
  - type: web
    name: drapefit
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install .
    startCommand: uvicorn drapefit.app:create_app --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SARVAM_MODEL
        value: sarvam-105b-conversations
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TASKS_SECRET
        generateValue: true
      - key: SARVAM_API_KEY
        sync: false
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
      - key: AGENT_PROFILE_URL
        sync: false
